services:
  clarity.api:
    image: clarity.api
    environment:
      - ConnectionStrings__ClarityDbContext
    build:
      context: .
      dockerfile: Clarity.Api/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      database.server:
        condition: service_healthy
    
      
  clarity.db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: